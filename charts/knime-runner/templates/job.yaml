apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ .Release.Name }}
spec:
  # Never fires on its own (Feb 31st doesn't exist) — this CronJob exists
  # purely as a reusable Job template, not a schedule. Trigger ad-hoc runs:
  #   kubectl create job --from=cronjob/{{ .Release.Name }} <run-name> -n <namespace>
  # Running a different workflow than values.yaml's default, or passing
  # -workflow.variable params per run, needs a standalone Job manifest
  # instead (copy this jobTemplate.spec as a starting point) — kubectl
  # create --from=cronjob doesn't support per-invocation arg overrides.
  schedule: "0 0 31 2 *"
  jobTemplate:
    spec:
      backoffLimit: 0
      ttlSecondsAfterFinished: 86400
      template:
        spec:
          restartPolicy: Never
          securityContext:
            fsGroup: 1000
          initContainers:
            - name: fetch-workflows
              image: alpine/git:latest
              env:
                - name: GIT_TOKEN
                  valueFrom:
                    secretKeyRef:
                      name: {{ .Values.git.secretName }}
                      key: {{ .Values.git.secretKey }}
              command:
                - sh
                - -c
                - |
                  AUTH_URL=$(echo "{{ .Values.git.repo }}" | sed "s#https://#https://x-access-token:${GIT_TOKEN}@#")
                  git clone --depth 1 "$AUTH_URL" /workflows
              volumeMounts:
                - name: workflows
                  mountPath: /workflows
          containers:
            - name: knime
              image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
              args:
                - "-workflowDir=/workflows/{{ .Values.workflow.name }}"
              securityContext:
                runAsNonRoot: true
                runAsUser: 1000
                allowPrivilegeEscalation: false
              volumeMounts:
                - name: workflows
                  mountPath: /workflows
                - name: results
                  mountPath: /results
              resources:
                {{- toYaml .Values.resources | nindent 16 }}
          volumes:
            - name: workflows
              emptyDir: {}
            - name: results
              persistentVolumeClaim:
                claimName: {{ .Release.Name }}-results
