image:
  # Built from CServinL/knime-workflows/runner/Dockerfile, pushed manually
  # (no CI for this one yet — the KNIME_URL build-arg can't be automated,
  # see that Dockerfile's comments).
  repository: ghcr.io/cservinl/knime-runner
  tag: latest

git:
  repo: "https://github.com/CServinL/knime-workflows.git"
  # GitHub PAT, read via HTTPS (x-access-token). Secret created separately
  # (not templated from values, never committed):
  #   kubectl create secret generic knime-workflows-token \
  #     --from-literal=token=<PAT> -n runners
  secretName: knime-workflows-token
  secretKey: token

# Default workflow to run when not overridden per-invocation (see README —
# ad-hoc runs with a different workflow/parameters need a custom Job manifest,
# not just `kubectl create job --from=cronjob/...`).
workflow:
  name: ""

persistence:
  size: 5Gi
  storageClassName: longhorn

resources:
  requests:
    cpu: 500m
    memory: 1Gi
  limits:
    cpu: "2"
    memory: 4Gi
