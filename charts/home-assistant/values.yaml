image:
  repository: ghcr.io/home-assistant/home-assistant
  tag: stable

# hostNetwork is on by default so Home Assistant can discover devices via
# mDNS/SSDP on the host's actual network(s), not just the cluster pod network.
hostNetwork: true

persistence:
  size: 2Gi

resources:
  requests:
    cpu: 250m
    memory: 256Mi
  limits:
    cpu: "1"
    memory: 1Gi

service:
  port: 8123

ingress:
  enabled: true
  host: homeassistant.forge.internal
  clusterIssuer: forge-ca
