apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-web
spec:
  type: ClusterIP
  selector:
    app: {{ .Release.Name }}
  ports:
    - name: http
      port: {{ .Values.service.webHttpPort }}
      targetPort: http
    - name: https
      port: {{ .Values.service.webHttpsPort }}
      targetPort: https
