apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app: {{ .Release.Name }}
    spec:
      hostNetwork: true
      dnsPolicy: None
      dnsConfig:
        nameservers:
          - 127.0.0.1
          - 8.8.8.8
      hostname: {{ .Values.hostname }}
      containers:
        - name: pihole
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          securityContext:
            privileged: false
            capabilities:
              add:
                - NET_BIND_SERVICE
          env:
            - name: FTLCONF_webserver_port
              value: "{{ .Values.service.webHttpPort }}"
            - name: FTLCONF_misc_etc_dnsmasq_d
              value: "true"
            - name: FTLCONF_dns_listeningMode
              value: "all"
            - name: FTLCONF_dns_upstreams
              value: "{{ .Values.dns.upstreams }}"
            - name: FTLCONF_database_maxDBdays
              value: "{{ .Values.maxDBdays }}"
            - name: FTLCONF_webserver_api_password
              valueFrom:
                secretKeyRef:
                  name: {{ .Release.Name }}-password
                  key: password
          ports:
            - name: http
              containerPort: {{ .Values.service.webHttpPort }}
              protocol: TCP
            - name: https
              containerPort: {{ .Values.service.webHttpsPort }}
              protocol: TCP
            - name: dns
              containerPort: 53
              protocol: TCP
            - name: dns-udp
              containerPort: 53
              protocol: UDP
            - name: client-udp
              containerPort: 67
              protocol: UDP
          livenessProbe:
            exec:
              command:
                - /bin/sh
                - -c
                - curl --silent http://localhost:{{ .Values.service.webHttpPort }}/api/info/login | jq "if (.dns | not) then halt_error(1) end"
            initialDelaySeconds: 60
            failureThreshold: 10
            timeoutSeconds: 5
          readinessProbe:
            exec:
              command:
                - /bin/sh
                - -c
                - curl --silent http://localhost:{{ .Values.service.webHttpPort }}/api/info/login | jq "if (.dns | not) then halt_error(1) end"
            initialDelaySeconds: 60
            failureThreshold: 10
            timeoutSeconds: 5
          volumeMounts:
            - name: config
              mountPath: /etc/pihole
            - name: custom-dnsmasq
              mountPath: /etc/dnsmasq.d/02-custom.conf
              subPath: 02-custom.conf
            - name: custom-dnsmasq
              mountPath: /etc/addn-hosts
              subPath: addn-hosts
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      volumes:
        - name: config
          persistentVolumeClaim:
            claimName: {{ .Release.Name }}
        - name: custom-dnsmasq
          configMap:
            name: {{ .Release.Name }}-custom-dnsmasq
