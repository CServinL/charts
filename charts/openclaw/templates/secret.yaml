{{- $secretName := printf "%s-secrets" .Release.Name }}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $secretName }}
{{- $gatewayToken := .Values.secrets.gatewayToken }}
{{- if not $gatewayToken }}
  {{- if $existing }}
    {{- $gatewayToken = index $existing.data "OPENCLAW_GATEWAY_TOKEN" | b64dec }}
  {{- else }}
    {{- $gatewayToken = randAlphaNum 32 }}
  {{- end }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $secretName }}
type: Opaque
stringData:
  OPENCLAW_GATEWAY_TOKEN: {{ $gatewayToken | quote }}
  ANTHROPIC_API_KEY: {{ .Values.secrets.anthropicApiKey | quote }}
  OPENAI_API_KEY: {{ .Values.secrets.openaiApiKey | quote }}
  GEMINI_API_KEY: {{ .Values.secrets.geminiApiKey | quote }}
  OPENROUTER_API_KEY: {{ .Values.secrets.openrouterApiKey | quote }}
