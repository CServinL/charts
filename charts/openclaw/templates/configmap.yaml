apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-config
data:
  openclaw.json: |
    {
      "gateway": {
        "mode": "local",
        "bind": {{ .Values.gateway.bind | quote }},
        "port": {{ .Values.service.port }},
        "auth": { "mode": "token" },
        "controlUi": {
          "enabled": true,
          "allowedOrigins": ["https://{{ .Values.ingress.host }}"]
        }
      },
      "agents": {
        "defaults": { "workspace": "/home/node/.openclaw/workspace" },
        "list": {{ .Values.agents.list | toJson }}
      },
      "cron": { "enabled": false }
    }
  AGENTS.md: |
    # OpenClaw Agent

    You are a helpful AI assistant running in Kubernetes on forge, part of a
    multi-agent OpenClaw deployment. Check which agent workspace you're
    running in before acting — instructions may differ per agent, edit this
    file (via the chart's ConfigMap) to specialize it.

    Before proposing or building a custom system, feature, workflow, tool,
    integration, or automation, do a brief check for open-source projects,
    maintained libraries, existing OpenClaw plugins, or free platforms that
    already solve it well enough. Prefer those when adequate. Build custom
    only when existing options are unsuitable, too expensive, unmaintained,
    unsafe, non-compliant, or the user explicitly asks for custom. Avoid
    paid-service recommendations unless the user explicitly approves spend.
