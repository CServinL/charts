image:
  repository: ghcr.io/openclaw/openclaw
  tag: slim

# lan = 0.0.0.0 inside the pod, required for the Ingress to reach the gateway
# (default is loopback-only). Token auth (already wired below) is mandatory
# for any non-loopback bind — OpenClaw refuses to start otherwise.
gateway:
  bind: lan

persistence:
  size: 10Gi
  # Explicit: forge's cluster currently has two StorageClasses both flagged
  # (default) (local-path and longhorn) — ambiguous, don't rely on whichever
  # wins by omission.
  storageClassName: longhorn

resources:
  requests:
    memory: 512Mi
    cpu: 250m
  limits:
    memory: 2Gi
    cpu: "1"

service:
  port: 18789

ingress:
  enabled: true
  host: openclaw.forge.internal
  clusterIssuer: forge-ca

# Rendered directly into openclaw.json's agents.list (array form, matches
# OpenClaw's own official k8s manifest — NOT the keyed agents.entries form
# from the docs, which appears to be a separate/alternate schema).
# Add one entry per marketing campaign as needed (marketing-<campaign>),
# then `helm upgrade`. Per-agent skill scoping (docs mention agents.entries.*.skills
# for the keyed form) is unconfirmed for this array form — verify before
# relying on it once skills are actually assigned.
agents:
  list:
    - id: home
      name: "Home Automation"
      workspace: "/home/node/.openclaw/workspace-home"

# The Secret is NOT managed by this chart at all — created and edited
# directly with kubectl, entirely outside Helm's reconciliation, so a
# `helm upgrade` for something unrelated (image tag, resources, etc.) can
# never silently wipe a key back to empty. The Deployment only references
# it by name:
#   kubectl create secret generic openclaw-secrets -n <namespace> \
#     --from-literal=OPENCLAW_GATEWAY_TOKEN=<random> \
#     --from-literal=ANTHROPIC_API_KEY= \
#     --from-literal=OPENAI_API_KEY= \
#     --from-literal=GEMINI_API_KEY= \
#     --from-literal=OPENROUTER_API_KEY=<your key>
# secretName below must match whatever you actually named it.
secretName: openclaw-secrets
