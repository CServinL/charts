apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}
spec:
  replicas: 1
  strategy:
    type: Recreate  # single PVC (RWO) — never run two pods against it at once
  selector:
    matchLabels:
      app: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app: {{ .Release.Name }}
    spec:
      # Default ndots:5 makes every lookup of a <2-dot external host (e.g.
      # api.zotero.org) try 3 doomed *.svc.cluster.local search-domain
      # variants before the real one -- 4x the DNS round-trips for no
      # benefit, since every hostname this pod actually calls in-cluster
      # (llama-server.default.svc.cluster.local) is already a full FQDN
      # that resolves first-try regardless of ndots. Lower to 1 so external
      # lookups (Zotero's Web API) go straight to the real query.
      dnsConfig:
        options:
          - name: ndots
            value: "1"
      containers:
        - name: prisma
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          # Pre-built image (see prisma's own Dockerfile + build-image.yml
          # workflow) -- code and the compiled UI are already baked in, no
          # git clone / pip install / npm build at pod start. The image's
          # own CMD (`prisma serve --host 0.0.0.0`) runs as-is.
          workingDir: /data
          # `prisma.storage.pending_queue`'s default queue file is a
          # CWD-relative "./data/pending_writes.json" -- workingDir /data
          # (not the image's own /app) puts that on the persistent PVC
          # instead of the ephemeral image filesystem, same as everything
          # else stateful this pod owns.
          env:
            - name: HOME
              value: /data
            - name: OPENROUTER_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secretsName }}
                  key: OPENROUTER_API_KEY
            # Optional -- unlike OPENROUTER_API_KEY, Zotero
            # integration isn't required for this deployment to run at all,
            # so a Secret without these keys must not block pod startup.
            - name: ZOTERO_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secretsName }}
                  key: ZOTERO_API_KEY
                  optional: true
            - name: ZOTERO_LIBRARY_ID
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secretsName }}
                  key: ZOTERO_LIBRARY_ID
                  optional: true
            # The UI's own origin (see service.yaml's NodePort setup) so the
            # api process's CORS allows requests from the page the web
            # process serves -- without this, prisma-desktop's dual
            # api_port/web_port model (both pointed at this same host) hits
            # the api process cross-origin from the browser's perspective
            # and every fetch gets silently blocked client-side.
            - name: PRISMA_CORS_EXTRA_ORIGINS
              value: "http://{{ .Values.ingress.host }}:{{ .Values.service.uiNodePort }}"
          ports:
            - name: api
              containerPort: {{ .Values.service.apiPort }}
            - name: ui
              containerPort: {{ .Values.service.uiPort }}
            - name: chroma
              containerPort: {{ .Values.service.chromaPort }}
          volumeMounts:
            - name: data
              mountPath: /data
            # HOME=/data above, so ConfigLoader's default lookup
            # (~/.config/prisma/config.toml) resolves to this path. Without
            # this mount, the ConfigMap this chart creates was never
            # actually wired into the running pod at all — a real gap found
            # 2026-07-25, not a hypothetical one. (config.yaml -> config.toml
            # 2026-07-27, see configmap.yaml's own comment.)
            - name: config
              mountPath: /data/.config/prisma/config.toml
              subPath: config.toml
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: {{ .Release.Name }}-data
        - name: config
          configMap:
            name: {{ .Release.Name }}-config
