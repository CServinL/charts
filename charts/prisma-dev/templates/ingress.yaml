{{- if .Values.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ .Release.Name }}
  annotations:
    cert-manager.io/cluster-issuer: {{ .Values.ingress.clusterIssuer }}
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - {{ .Values.ingress.host }}
      secretName: {{ .Release.Name }}-tls
  rules:
    - host: {{ .Values.ingress.host }}
      http:
        paths:
          # Routes to the "api" port (8765), not "ui" — the desktop/PWA
          # client's own "Server URL" setting is the API's REST+WS base
          # (see prisma-desktop's src/routes/+page.svelte apiBase/wsBase),
          # and the Tauri shell always loads its UI assets from its own
          # local Web process regardless of Server URL. A separate rule
          # (or host) would be needed to also expose the "ui" port for a
          # pure-browser/PWA client hitting this host directly.
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ .Release.Name }}
                port:
                  name: api
{{- end }}
