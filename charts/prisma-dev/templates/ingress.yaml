{{- if .Values.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ .Release.Name }}
  annotations:
    cert-manager.io/cluster-issuer: {{ .Values.ingress.clusterIssuer }}
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - {{ .Values.ingress.host }}
      secretName: {{ .Release.Name }}-tls
  rules:
    - host: {{ .Values.ingress.host }}
      http:
        paths:
          # /app -> the "ui" port (8766, unauthenticated static shell, no
          # AuthMiddleware -- see prisma/server/web_app.py). Needed so a
          # Tauri shell (or a plain browser/PWA client) can load the UI
          # directly from this server instead of only ever from a local
          # `prisma serve` process. Listed before the catch-all below;
          # Prefix pathType matches longest-prefix regardless of rule
          # order, but keeping the more specific rule first for clarity.
          - path: /app
            pathType: Prefix
            backend:
              service:
                name: {{ .Release.Name }}
                port:
                  name: ui
          # Everything else -> the "api" port (8765), AuthMiddleware and
          # all -- the desktop/PWA client's own "Server URL" setting is
          # the API's REST+WS base (see prisma-desktop's
          # src/routes/+page.svelte apiBase/wsBase).
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ .Release.Name }}
                port:
                  name: api
{{- end }}
