apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}
spec:
  selector:
    app: {{ .Release.Name }}
  ports:
    - name: api
      port: {{ .Values.service.apiPort }}
      targetPort: api
    - name: ui
      port: {{ .Values.service.uiPort }}
      targetPort: ui
    - name: chroma
      port: {{ .Values.service.chromaPort }}
      targetPort: chroma
