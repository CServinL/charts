apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-config
data:
  # prisma migrated its config format from YAML to TOML (2026-07-27) --
  # stdlib tomllib, no new dependency. sources.zotero here intentionally
  # only lists the fields ZoteroConfig actually has; the old template
  # carried mode/disable_writes_when_offline/auto_save_papers/
  # auto_save_collection, none of which exist on that Pydantic model --
  # dead config, silently ignored, not a behavior change to drop them.
  config.toml: |
    [sources.zotero]
    enabled = true
    # Real key/library ID live in the pre-created Secret's ZOTERO_API_KEY/
    # ZOTERO_LIBRARY_ID (see values.yaml's secretsName comment) --
    # api_key_env/library_id_env take priority over their literal
    # counterparts, so the ConfigMap itself never holds either. Neither is
    # required for the deployment to start -- Zotero integration just
    # degrades to offline mode if these Secret keys are unset (see
    # deployment.yaml's `optional: true` on both env vars).
    api_key_env = "ZOTERO_API_KEY"
    library_id_env = "ZOTERO_LIBRARY_ID"
    library_type = "user"

    [search]
    default_limit = 10
    sources = ["semanticscholar", "arxiv", "openlibrary", "googlebooks", "zotero"]
    prefer_high_quality = true
    min_confidence_score = 0.3

    # KG extraction — OpenRouter (2026-07-25), same reasoning as chat below:
    # forge's iGPU can't run a 7B-class model fast enough, and no local
    # 3B-class model tested meets the extraction-quality bar. api_key comes
    # from the OPENROUTER_API_KEY env var (see deployment.yaml), never this
    # file. context_window is a static value here since OpenRouter has no
    # local endpoint to live-query it from (unlike ollama/llama_cpp).
    [llm]
    provider = "openrouter"
    model = "{{ .Values.openrouter.kgModel }}"
    api_key_env = "OPENROUTER_API_KEY"
    context_window = {{ .Values.openrouter.kgContextWindow }}

    # Chat backend — OpenRouter (ADR-014, openai-SDK-compatible).
    # pool must match a compute_pools name below — ChatLLM passes it
    # explicitly to resource_lock.lease() (unlike KG, which only matches by
    # model name), so leaving this at ChatConfig's "local-ollama" default
    # (no such pool exists in this deployment) meant every chat lease
    # request was denied outright — found live 2026-07-25, chat never
    # actually reached OpenRouter despite provider being set correctly.
    # api_key_env is equally required — without it, ChatLLM._resolve_api_key()
    # silently falls back to a dummy "ollama" placeholder string instead of
    # raising, so this was a second, separate bug (also found live
    # 2026-07-25): the lease got granted correctly and the request really
    # reached OpenRouter, but with no real Authorization header at all,
    # 401 "Missing Authentication header".
    [chat]
    provider = "openrouter"
    model = "{{ .Values.openrouter.chatModel }}"
    pool = "openrouter"
    api_key_env = "OPENROUTER_API_KEY"

    # ChromaDB embeddings — local, via the already-deployed llama-server
    # chart's bge-m3 (OpenRouter serves no embedding models at all).
    [retrieval]
    provider = "llama_cpp"
    embedding_model = "{{ .Values.retrieval.embeddingModel }}"
    ollama_base_url = "{{ .Values.retrieval.baseUrl }}"
    chroma_port = {{ .Values.service.chromaPort }}

    # ADR-011 password-mode auth — see values.yaml's auth.passwordHash comment
    # for how to generate/set the actual hash.
    [server.auth]
    mode = "{{ .Values.auth.mode }}"
    password_hash = '{{ .Values.auth.passwordHash }}'

    # Cloud pool for both chat and KG's OpenRouter calls — `type: cloud`
    # means no local VRAM/model-affinity constraint (see supervisor.py's
    # _load_compute_pools docstring). Without this, both would silently fall
    # into the single-model-affinity "default" pool fallback and contend
    # with each other and with chroma's local embedding calls for no real
    # hardware reason. Only one model entry -- chat and KG both use the same
    # OpenRouter model here, so the old template's two identical-looking
    # entries were really just one model listed twice.
    [[compute_pools]]
    name = "openrouter"
    type = "cloud"
    provider = "openrouter"
    max_concurrent = 8

    [[compute_pools.models]]
    name = "{{ .Values.openrouter.chatModel }}"

    {{- if ne .Values.openrouter.chatModel .Values.openrouter.kgModel }}
    [[compute_pools.models]]
    name = "{{ .Values.openrouter.kgModel }}"
    {{- end }}

    # Local pool for the embedding model -- without this, ResourceManager's
    # model-not-found fallback (supervisor.py's _candidate_pools) routes
    # embedding requests through every configured pool, including
    # openrouter's cloud-sized max_concurrent against this single local GPU.
    [[compute_pools]]
    name = "local-embeddings"
    provider = "llama_cpp"
    max_concurrent = {{ .Values.retrieval.maxConcurrent }}

    [[compute_pools.models]]
    name = "{{ .Values.retrieval.embeddingModel }}"

    [output]
    directory = "./outputs"
    format = "markdown"
