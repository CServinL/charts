image:
  # Pre-built image: prisma's own Dockerfile + .github/workflows/build-image.yml
  # build and push this on every push to main. Code and the compiled UI are
  # both already baked in — updating means bumping `tag` here (to a newer
  # pinned version, or "latest" to float) and rolling out, not a git
  # pull/restart cycle.
  repository: ghcr.io/cservinl/prisma
  tag: "0.1.0"

# Name of a single pre-created Secret (not managed by this chart) holding
# every credential this deployment needs, one key each:
#   - OPENROUTER_API_KEY (chat + KG extraction, ADR-014/2026-07-25 routing)
#   - ZOTERO_API_KEY / ZOTERO_LIBRARY_ID (both optional — referenced via
#     config.toml's sources.zotero.api_key_env/library_id_env, 2026-07-27;
#     Zotero integration just stays offline if either is absent from the
#     Secret, not a startup failure)
# e.g.:
#   kubectl create secret generic prisma-secrets -n prisma \
#     --from-literal=OPENROUTER_API_KEY=sk-or-... \
#     --from-literal=ZOTERO_API_KEY=... \
#     --from-literal=ZOTERO_LIBRARY_ID=... # both optional
secretsName: prisma-secrets

persistence:
  # Holds vault + config + pending-writes queue (workingDir /data, see
  # deployment.yaml) — no repo/venv anymore now that the image ships code
  # pre-installed. Longhorn is plain/unencrypted here on purpose — vault
  # encryption is a
  # deferred Prisma-side feature (gocryptfs + unlock-over-LAN), not solved at
  # the storage layer. See prisma's TODO.md "Deferred feature: vault unlock
  # over LAN instead of an at-rest key".
  storageClassName: longhorn
  size: 20Gi

resources:
  requests:
    cpu: 500m
    memory: 1Gi
  limits:
    cpu: "2"
    memory: 4Gi

service:
  apiPort: 8765
  uiPort: 8766
  chromaPort: 8767
  # NodePort (2026-08-11): prisma-desktop's Settings model has separate
  # hostname:api_port and hostname:web_port, both used directly (window.rs's
  # resolve_start_url navigates to web_url() itself, not a hardcoded local
  # URL) -- both need a real network path to this deployment from the LAN,
  # not just the API. K8s NodePort range on this cluster is the unmodified
  # default (30000-32767), so 8765/8766 themselves aren't valid nodePort
  # values -- these are the closest memorable equivalents.
  type: NodePort
  apiNodePort: 30765
  uiNodePort: 30766

openrouter:
  # Cheap model by default — swap once you've picked one deliberately (see
  # TODO.md's OpenRouter model discussion for kg extraction/chat).
  chatModel: "openai/gpt-4o-mini"
  # KG extraction routed to OpenRouter too (2026-07-25), not local llama-swap
  # — forge's own iGPU (680M) craters on 7B-class token generation (see
  # docs/llamacpp-vulkan-forge-vs-anvil-benchmark.md), and no local 3B-class
  # model tested so far (generic qwen2.5-3b, NuExtract-2.0-4B) clears the
  # extraction-quality bar (docs/qwen3-family-evaluation.md,
  # docs/nuextract-2.0-kg-extraction-evaluation.md) — trading local compute
  # for cost-per-call rather than shipping known-bad extraction quality.
  # Uses the same OPENROUTER_API_KEY secret as chat.
  kgModel: "openai/gpt-4o-mini"
  kgContextWindow: 128000

# Local llama-swap instance already deployed on forge (see the sibling
# llama-server chart) — used for embeddings only (bge-m3; OpenRouter serves
# no embedding models). Chat/KG both go to OpenRouter instead of this roster
# (see above) — forge's iGPU isn't fast enough for 7B-class KG extraction,
# and chat was already cloud-routed (ADR-014).
retrieval:
  embeddingModel: "bge-m3"
  baseUrl: "http://llama-server.default.svc.cluster.local:8090"

# ADR-011 password-mode auth — forge is reachable over the LAN (that's the
# whole point of desktop vault-sync), so this should not stay "none" once
# anything besides local testing depends on it.
auth:
  mode: password
  # Generate with (from a prisma checkout, venv active):
  #   prisma auth hash-password
  # Left empty by default like zotero.api_key below — no password will ever
  # verify() true against an empty hash (see server/auth.py), so auth is
  # effectively "no one can log in" until this is set via --set or a values
  # override file (not committed to git).
  passwordHash: ""

# Same TLS/DNS pattern every other *.forge.internal service uses
# (forge-ca ClusterIssuer, Pi-hole custom DNS record) — needed for the
# desktop/PWA client's "Server URL" to reach this deployment from the LAN
# at all, not just from inside the cluster.
ingress:
  enabled: true
  host: prisma.forge.internal
  clusterIssuer: forge-ca
