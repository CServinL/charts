image:
  # Generic Python base — dev mode has no baked Prisma image. An initContainer
  # clones/pulls the repo and does `pip install -e .` into a persisted venv on
  # every pod start, so code updates are just "git pull, then restart the pod"
  # — no image build/push step.
  repository: python
  tag: "3.12-slim"

git:
  repo: https://github.com/CServinL/prisma.git
  branch: main

# Name of a pre-created Secret (not managed by this chart) holding a GitHub
# token, used for authenticated HTTPS git operations (both the git-sync
# initContainer and a manual `kubectl exec ... git pull` for updates) —
# prisma is public so this isn't required for clone/pull to work at all,
# but avoids unauthenticated rate limits across the LAN's several
# git-clone-based deployments sharing forge's egress IP. Not scoped to
# prisma specifically (shared across deployments), e.g.:
#   kubectl create secret generic deploy-all -n prisma --from-file=token=...
deployTokenSecretName: deploy-all

persistence:
  # Holds the cloned repo + venv (rebuilt fast if unchanged) + vault + config.
  # Longhorn is plain/unencrypted here on purpose — vault encryption is a
  # deferred Prisma-side feature (gocryptfs + unlock-over-LAN), not solved at
  # the storage layer. See prisma's TODO.md "Deferred feature: vault unlock
  # over LAN instead of an at-rest key".
  storageClassName: longhorn
  size: 20Gi

resources:
  requests:
    cpu: 500m
    memory: 1Gi
  limits:
    cpu: "2"
    memory: 4Gi

service:
  apiPort: 8765
  uiPort: 8766
  chromaPort: 8767

# Name of a pre-created Secret (not managed by this chart) holding the
# OpenRouter API key, e.g.:
#   kubectl create secret generic prisma-openrouter -n prisma \
#     --from-literal=OPENROUTER_API_KEY=sk-or-...
openrouterSecretName: prisma-openrouter

openrouter:
  # Cheap model by default — swap once you've picked one deliberately (see
  # TODO.md's OpenRouter model discussion for kg extraction/chat).
  chatModel: "openai/gpt-4o-mini"
  # KG extraction routed to OpenRouter too (2026-07-25), not local llama-swap
  # — forge's own iGPU (680M) craters on 7B-class token generation (see
  # docs/llamacpp-vulkan-forge-vs-anvil-benchmark.md), and no local 3B-class
  # model tested so far (generic qwen2.5-3b, NuExtract-2.0-4B) clears the
  # extraction-quality bar (docs/qwen3-family-evaluation.md,
  # docs/nuextract-2.0-kg-extraction-evaluation.md) — trading local compute
  # for cost-per-call rather than shipping known-bad extraction quality.
  # Uses the same OPENROUTER_API_KEY secret as chat.
  kgModel: "openai/gpt-4o-mini"
  kgContextWindow: 128000

# Local llama-swap instance already deployed on forge (see the sibling
# llama-server chart) — used for embeddings only (bge-m3; OpenRouter serves
# no embedding models). Chat/KG both go to OpenRouter instead of this roster
# (see above) — forge's iGPU isn't fast enough for 7B-class KG extraction,
# and chat was already cloud-routed (ADR-014).
retrieval:
  embeddingModel: "bge-m3"
  baseUrl: "http://llama-server.default.svc.cluster.local:8090"

# ADR-011 password-mode auth — forge is reachable over the LAN (that's the
# whole point of desktop vault-sync), so this should not stay "none" once
# anything besides local testing depends on it.
auth:
  mode: password
  # Generate with (from a prisma checkout, venv active):
  #   prisma auth hash-password
  # Left empty by default like zotero.api_key below — no password will ever
  # verify() true against an empty hash (see server/auth.py), so auth is
  # effectively "no one can log in" until this is set via --set or a values
  # override file (not committed to git).
  passwordHash: ""

ingress:
  enabled: false
  host: prisma.forge.internal
  clusterIssuer: forge-ca
